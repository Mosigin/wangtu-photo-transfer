name: Source and protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py --platform simulator --output "${{ runner.temp }}/wangtu-project"
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pure phone policy checks
        run: |
          xcrun swiftc ios/ImportPolicy.swift tests/PolicyChecks.swift -o "$RUNNER_TEMP/wangtu-policy"
          "$RUNNER_TEMP/wangtu-policy"
      - name: iOS source type check (no install)
        run: |
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/ImportPolicy.swift ios/WangtuPhotoTransfer.swift
